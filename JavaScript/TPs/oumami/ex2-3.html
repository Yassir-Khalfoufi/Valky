<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let resultat ='';
        for(let i = 1; i <= 10; i++) {
            for(let j = 1; j <= i; j++) {
                resultat += '* ';
            }
            document.write(resultat + "<br>");
            resultat = '';
        }
    </script>
</body>
</html>
