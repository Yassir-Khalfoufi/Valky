<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Learner</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card border-primary">
            <div class="card-header text-center bg-light border-primary">
                <h4>Enregistrer un nouvel apprenant</h4>
            </div>
            <div class="card-body">
                <form>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="id" class="form-label">Votre identifiant</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-id-card"></i></span>
                                <input type="text" class="form-control" id="id" placeholder="Votre identifiant">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="prenom" class="form-label">Votre prénom</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-user"></i></span>
                                <input type="text" class="form-control" id="prenom" placeholder="Votre prénom">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="nom" class="form-label">Votre nom</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-users"></i></span>
                                <input type="text" class="form-control" id="nom" placeholder="Votre nom">
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-at"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="Email@gmail.com">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="dob" class="form-label">Date de naissance</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-cake-candles"></i></span>
                                <input type="date" class="form-control" id="dob">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Sexe</label><br>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="sexe" id="homme" value="homme">
                                <label class="form-check-label" for="homme">Homme</label>
                            </div>                             
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="sexe" id="femme" value="femme">
                                <label class="form-check-label" for="femme">Femme</label>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-8">
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-house"></i></span>
                                <input type="text" class="form-control" id="adresse" placeholder="Saisir votre adresse">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-globe"></i></span>
                                <select id="gouvernorat" class="form-select">
                                    <option selected>liste déroulante basée sur la table gouvernorat</option>
                                    <option value="1">Option 1</option>
                                    <option value="2">Option 2</option>
                                    <option value="3">Option 3</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-key"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="Mot de passe">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-clock-rotate-left"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="Mot de passe">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="fa-solid fa-book"></i></i></span>
                                <select id="gouvernorat" class="form-select">
                                    <option selected >liste déroulante basée sur la table groupe</option>
                                    <option value="1">Option 1</option>
                                    <option value="2">Option 2</option>
                                    <option value="3">Option 3</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <hr>

                    <div class="d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary col-md-8">Envoyer</button>
                        <button type="reset" class="btn btn-danger col-md-3">Effacer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
