<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TABLE</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
  </head>
  <body>

    <div class="container">
      <div class="row bg-primary border border-primary rounded">
        <div class="col-xl-12 text-center">
          8 colonnes
          <div class="row">
            <div
              class="col-3 bg-info border border-3 border-primary rounded p-3"
            >
              3 colonnes
            </div>
            <div
              class="col-6 bg-info border border-3 border-primary rounded p-3"
            >
              6 colonnes
            </div>
            <div
              class="col-3 bg-info border border-3 border-primary rounded p-3"
            >
              3 colonnes
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="row">
        <div
          class="col-12 bg-info text-center rounded border border-2 border-primary"
        >
          Premier niveau avec 12 colonnes
          <div class="row">
            <div
              class="col-8 bg-info text-center rounded border border-2 border-primary pb-5"
            >
              Second niveau avec 8 colonnes
              <div class="row">
                <div
                  class="col-4 bg-info text-center rounded border border-2 border-primary"
                >
                  Troisieme niveau avec 4 colonnes
                </div>
                <div
                  class="col-6 bg-info text-center rounded border border-2 border-primary"
                >
                  Troisieme niveau avec 6 colonnes
                  <div class="row">
                    <div
                      class="col-3 bg-info text-center rounded border border-2 border-primary"
                    >
                      Quatrieme niveau avec 3 colonnes
                    </div>
                    <div
                      class="col-5 bg-info text-center rounded border border-2 border-primary"
                    >
                      Quatrieme niveau avec 5 colonnes
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div
              class="col-4 bg-info text-center rounded border border-2 border-primary"
            >
              Second niveau avec 4 colonnes
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.min.js"></script>
  </body>
</html>
